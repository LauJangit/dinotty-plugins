name: Marketplace PR gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: marketplace-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  marketplace-pr-gate:
    name: marketplace-pr-gate
    outputs:
      auto_merge: ${{ steps['source-check'].outputs.auto_merge }}
      pr_number: ${{ steps.route.outputs.pr_number }}
      head_sha: ${{ steps.route.outputs.head_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Route and validate changed files from the base workflow
        id: route
        uses: actions/github-script@v8
        env:
          AUTOMATION_LOGIN: ${{ vars.MARKETPLACE_AUTOMATION_LOGIN }}
          CODEOWNER_LOGIN: ${{ vars.MARKETPLACE_CODEOWNER_LOGIN || 'LauJangit' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const base = context.payload.pull_request.base.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const changedPaths = files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean));
            const forbidden = /^(audits|revocations|sources|policies|published|keys)(\/|$)/i;
            if (changedPaths.some((name) => forbidden.test(name))) {
              core.setFailed('Marketplace control data belongs in the website database.');
              return;
            }
            if (files.some((file) => file.status === 'renamed' || file.status === 'copied')) {
              core.setFailed('Marketplace control files may not be renamed or copied.');
              return;
            }
            const workflowChanged = changedPaths.some((name) => name.startsWith('.github/workflows/') || name === '.github/CODEOWNERS');
            if (workflowChanged) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number, per_page: 100,
              });
              const ownerLogin = process.env.CODEOWNER_LOGIN.toLowerCase();
              const ownerReviews = reviews
                .filter((review) => review.user?.login?.toLowerCase() === ownerLogin)
                .sort((left, right) => {
                  const submitted = (left.submitted_at || '').localeCompare(right.submitted_at || '');
                  return submitted || (left.id || 0) - (right.id || 0);
                });
              const latest = ownerReviews.at(-1);
              const approved = latest?.state === 'APPROVED' && latest.commit_id === head;
              if (!approved) {
                core.setFailed('Workflow changes require current-head CODEOWNER approval.');
                return;
              }
            }
            const sourceChanged = files.some((file) => file.filename === 'repositories.txt' || file.previous_filename === 'repositories.txt');
            const registryChanged = files.some((file) => file.filename === 'registry.json' || file.previous_filename === 'registry.json');
            if (sourceChanged && (files.length !== 1 || files[0].filename !== 'repositories.txt')) {
              core.setFailed('A source PR may only modify repositories.txt.');
              return;
            }
            if (registryChanged) {
              if (files.length !== 1 || files[0].filename !== 'registry.json' || ['removed', 'deleted'].includes(files[0].status)) {
                core.setFailed('A legacy projection PR may only modify registry.json.');
                return;
              }
              const expected = process.env.AUTOMATION_LOGIN?.toLowerCase();
              const author = context.payload.pull_request.user.login.toLowerCase();
              if (!expected || author !== expected) {
                core.setFailed('registry.json is only updated by the configured automation account.');
                return;
              }
              async function readJson(ref) {
                const response = await github.rest.repos.getContent({ owner, repo, path: 'registry.json', ref });
                const text = Buffer.from(response.data.content, 'base64').toString('utf8');
                return JSON.parse(text);
              }
              const previous = await readJson(base);
              const next = await readJson(head);
              if (!next || !Array.isArray(next.plugins)) throw new Error('registry.json must contain a plugins array');
              const oldVersions = new Map((previous.plugins || []).map((plugin) => [plugin.id, plugin.version]));
              const ids = new Set();
              for (const plugin of next.plugins) {
                for (const key of ['id', 'name', 'description', 'version', 'repo', 'branch', 'subdir']) {
                  if (typeof plugin[key] !== 'string' || !plugin[key]) throw new Error(`registry plugin is missing ${key}`);
                }
                const subdir = plugin.subdir;
                const safeSubdir = subdir === '.' ||
                  (!subdir.startsWith('/') && !subdir.includes('\\') &&
                    subdir.split('/').every((part) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(part) && part !== '.' && part !== '..'));
                if (plugin.branch !== 'main' || !safeSubdir || ids.has(plugin.id)) {
                  throw new Error('registry projection must use unique IDs, branch main, and a safe subdir');
                }
                ids.add(plugin.id);
                const before = oldVersions.get(plugin.id);
                if (before && before.localeCompare(plugin.version, undefined, { numeric: true }) > 0) {
                  throw new Error(`version regression for ${plugin.id}`);
                }
              }
            }
            core.setOutput('source_changed', sourceChanged ? 'true' : 'false');
            core.setOutput('registry_changed', registryChanged ? 'true' : 'false');
            core.setOutput('pr_number', String(pull_number));
            core.setOutput('head_sha', head);

      - name: Ask the website to validate repositories.txt
        if: steps.route.outputs.source_changed == 'true'
        id: source-check
        uses: actions/github-script@v8
        env:
          OFFSITE_URL: ${{ vars.DINOTTY_OFFSITE_URL }}
          OIDC_AUDIENCE: ${{ vars.DINOTTY_OIDC_AUDIENCE || 'dinotty-offsite' }}
          PR_NUMBER: ${{ steps.route.outputs.pr_number }}
          HEAD_SHA: ${{ steps.route.outputs.head_sha }}
        with:
          script: |
            if (!process.env.OFFSITE_URL) throw new Error('DINOTTY_OFFSITE_URL repository variable is required');
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            const response = await fetch(`${process.env.OFFSITE_URL.replace(/\/$/, '')}/api/internal/github/source-pr-checks`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ prNumber: Number(process.env.PR_NUMBER), headSha: process.env.HEAD_SHA }),
            });
            const body = await response.json().catch(() => ({}));
            core.setOutput('auto_merge', body.autoMerge === true ? 'true' : 'false');
            if (!response.ok || !['passed', 'pending'].includes(body.result)) {
              const reason = body.error?.code || body.error?.message || body.code || body.message || JSON.stringify(body);
              throw new Error(`website source check failed (${response.status}): ${reason}`);
            }
            if (body.result === 'pending') {
              core.info('Deterministic precheck passed; waiting for manual candidate review before merge.');
            }

  marketplace-pr-auto-merge:
    name: marketplace-pr-auto-merge
    needs: marketplace-pr-gate
    if: ${{ needs['marketplace-pr-gate'].outputs.auto_merge == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Ask the website to merge the validated source PR
        uses: actions/github-script@v8
        env:
          OFFSITE_URL: ${{ vars.DINOTTY_OFFSITE_URL }}
          OIDC_AUDIENCE: ${{ vars.DINOTTY_OIDC_AUDIENCE || 'dinotty-offsite' }}
          PR_NUMBER: ${{ needs['marketplace-pr-gate'].outputs.pr_number }}
          HEAD_SHA: ${{ needs['marketplace-pr-gate'].outputs.head_sha }}
        with:
          script: |
            if (!process.env.OFFSITE_URL) throw new Error('DINOTTY_OFFSITE_URL repository variable is required');
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            const response = await fetch(`${process.env.OFFSITE_URL.replace(/\/$/, '')}/api/internal/github/source-pr-merges`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ prNumber: Number(process.env.PR_NUMBER), headSha: process.env.HEAD_SHA }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || !['merged', 'already_merged'].includes(body.action)) {
              const reason = body.error?.code || body.error?.message || body.code || body.message || JSON.stringify(body);
              throw new Error(`website source merge failed (${response.status}): ${reason}`);
            }
            core.info(`Website source PR ${body.action}.`);
