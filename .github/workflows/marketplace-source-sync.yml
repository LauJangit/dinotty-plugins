name: Marketplace source sync

on:
  push:
    branches: [main]
    paths: [repositories.txt]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-source-sync
  cancel-in-progress: false

jobs:
  source-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize the fixed main commit into the website database
        uses: actions/github-script@v8
        env:
          OFFSITE_URL: ${{ vars.DINOTTY_OFFSITE_URL || 'https://www.dinotty.com' }}
          OIDC_AUDIENCE: ${{ vars.DINOTTY_OIDC_AUDIENCE || 'dinotty-offsite' }}
        with:
          script: |
            const base = process.env.OFFSITE_URL.replace(/\/$/, '');
            const token = await core.getIDToken(process.env.OIDC_AUDIENCE);
            const start = await fetch(`${base}/api/internal/github/source-syncs`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ commitSha: context.sha }),
            });
            const job = await start.json().catch(() => ({}));
            if (!start.ok || !job.jobId) throw new Error(`source sync start failed (${start.status})`);
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const statusToken = await core.getIDToken(process.env.OIDC_AUDIENCE);
              const response = await fetch(`${base}/api/internal/github/jobs/${job.jobId}`, {
                headers: { Authorization: `Bearer ${statusToken}` },
              });
              const status = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(`source sync status failed (${response.status})`);
              if (status.status === 'completed') return;
              if (status.status === 'failed') throw new Error(`source sync failed: ${status.errorCode || 'unknown'}`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error('source sync timed out');
